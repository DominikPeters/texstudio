name: Windows WSL live preview
on:
  push:
    branches: [texpresso-windows-wsl]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-wsl-${{ github.ref }}
  cancel-in-progress: true
jobs:
  engine:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config patchelf \
            libsdl2-dev libfreetype-dev libbrotli-dev \
            libjbig2dec0-dev libjpeg-dev libopenjp2-7-dev libfontconfig-dev \
            libharfbuzz-dev libgraphite2-dev libicu-dev libpng-dev \
            texlive-xetex texlive-latex-extra
      - name: Read locked compressor
        id: compressor
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("revision=" + json.load(open("native/dependencies.lock.json"))["zlibNg"]["revision"] + "\n")'
      - uses: actions/checkout@v4
        with:
          repository: zlib-ng/zlib-ng
          ref: ${{ steps.compressor.outputs.revision }}
          path: .native-sources/zlib-ng
          persist-credentials: false
      - name: Read locked renderer
        id: renderer
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("revision=" + json.load(open("native/dependencies.lock.json"))["mupdf"]["revision"] + "\n")'
      - uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: ${{ steps.renderer.outputs.revision }}
          path: .native-sources/mupdf
          persist-credentials: false
      - name: Fetch locked LCMS2 renderer dependency
        run: git -C .native-sources/mupdf submodule update --init --depth 1 thirdparty/lcms2
      - name: Build engine and test supervisor lifetime
        run: |
          python3 -m unittest discover -s native/tests -p test_wsl_supervisor.py
          python3 native/scripts/build_linux.py --mupdf-source .native-sources/mupdf --zlib-ng-source .native-sources/zlib-ng --jobs 2
          python3 native/scripts/validate_bundle.py native/.bundles/linux-x86_64 --windows-wsl
          tar -C native/.bundles/linux-x86_64 -czf engine-linux-x86_64.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: windows-wsl-linux-engine
          path: engine-linux-x86_64.tar.gz
          retention-days: 3
  windows:
    needs: engine
    runs-on: windows-2025
    timeout-minutes: 60
    steps:
      - name: Preserve pinned Linux source bytes on Windows
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/download-artifact@v4
        with:
          name: windows-wsl-linux-engine
      - name: Install WSL Ubuntu for CI (application accepts any distribution)
        shell: pwsh
        run: |
          wsl.exe --install --distribution Ubuntu-24.04 --no-launch
          if ($LASTEXITCODE -ne 0) { throw 'WSL installation failed' }
          # Current WSL returns an error when converting an already-WSL2 distro.
          # Check the installed version directly instead of a redundant conversion.
          $listed = (wsl.exe --list --verbose | Out-String).Replace("`0", "")
          Write-Output $listed
          if ($listed -notmatch '(?m)Ubuntu-24\.04\s+.+\s+2\s*$') { throw 'The test distribution is not WSL2' }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec sh -c 'grep -qi microsoft /proc/sys/kernel/osrelease && uname -r'
          if ($LASTEXITCODE -ne 0) { throw 'WSL kernel preflight failed' }
          wsl.exe --distribution Ubuntu-24.04 --user root --exec sh -c 'apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends texlive-xetex texlive-latex-extra texlive-bibtex-extra biber'
          if ($LASTEXITCODE -ne 0) { throw 'Linux TeX Live setup failed' }
          wsl.exe --set-default Ubuntu-24.04
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git make zip mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python mingw-w64-ucrt-x86_64-python-pillow
            mingw-w64-ucrt-x86_64-qt6-base mingw-w64-ucrt-x86_64-qt6-declarative
            mingw-w64-ucrt-x86_64-qt6-tools mingw-w64-ucrt-x86_64-qt6-svg
            mingw-w64-ucrt-x86_64-qt6-translations mingw-w64-ucrt-x86_64-qt6-5compat
            mingw-w64-ucrt-x86_64-quazip-qt6 mingw-w64-ucrt-x86_64-hunspell
            mingw-w64-ucrt-x86_64-poppler mingw-w64-ucrt-x86_64-poppler-qt6
            mingw-w64-ucrt-x86_64-python-mingw-ldd
      - name: Build native Windows app and Qt integration test
        shell: msys2 {0}
        run: |
          # NTFS does not preserve Linux executable modes. Validate contents instead.
          git -C native/texpresso config core.filemode false
          git -C native/texpresso status --short
          mkdir -p native/.bundles/linux-x86_64
          tar -xzf engine-linux-x86_64.tar.gz -C native/.bundles/linux-x86_64
          cmake -S . -B build-windows -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DTEXSTUDIO_ENABLE_TEXPRESSO=ON -DTEXSTUDIO_TEXPRESSO_TESTS=ON \
            -DTEXPRESSO_BUNDLE_DIR="$PWD/native/.bundles/linux-x86_64"
          cmake --build build-windows --target texstudio texpresso-wsl-tests texpresso_bundle -j3
      - name: Exercise Windows client against actual WSL2 engine
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          TEXPRESSO_WSL_DISTRIBUTION: Ubuntu-24.04
        run: |
          $env:PATH = "C:\msys64\ucrt64\bin;" + $env:PATH
          $env:TEXPRESSO_TEST_COMMAND_RUNNER = "$env:GITHUB_WORKSPACE\build-windows\texstudio-wsl.exe"
          $env:TEXPRESSO_TEST_ENGINE = "$env:GITHUB_WORKSPACE\build-windows\texpresso-runtime\bin\texpresso"
          & .\build-windows\src\texpresso\texpresso-wsl-tests.exe -o wsl-tests.xml,xunitxml -o wsl-tests.txt,txt
          if ($LASTEXITCODE -ne 0) { throw 'Native Windows / WSL integration failed' }
          wsl.exe --distribution Ubuntu-24.04 --exec sh -c 'if pgrep -f "[/]texpresso(-xetex|-wsl)?( |$)"; then echo "Leaked engine workers" >&2; exit 1; fi'
          if ($LASTEXITCODE -ne 0) { throw 'Compiler worker leak detected' }
          & .\build-windows\texstudio.exe --version
          if ($LASTEXITCODE -ne 0) { throw 'Windows app startup failed' }
      - name: Package portable development app
        shell: msys2 {0}
        run: |
          mkdir -p dist/TeXstudio-Espresso
          cp build-windows/texstudio.exe build-windows/texstudio-wsl.exe dist/TeXstudio-Espresso/
          cp -R build-windows/texpresso-runtime dist/TeXstudio-Espresso/
          cd dist/TeXstudio-Espresso
          windeployqt6 --no-qml --qmlcore --no-translations texstudio.exe
          ldd texstudio.exe | awk '{print $3}' | grep ucrt64 | xargs -I{} cp -u {} .
          cp -R ../../templates .
          mkdir dictionaries
          cp ../../utilities/dictionaries/*.zip dictionaries/ 2>/dev/null || true
          cp ../../utilities/dictionaries/*.aff ../../utilities/dictionaries/*.dic dictionaries/
          mkdir -p share
          cp -R "$MSYSTEM_PREFIX/share/poppler" share/
          mkdir config
          QT_QPA_PLATFORM=offscreen ./texstudio.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: TeXstudio-Espresso-Windows-WSL-development
          path: dist/TeXstudio-Espresso/
          retention-days: 7
      - name: Save integration diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-wsl-diagnostics
          path: |
            wsl-tests.*
            build-windows/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
