name: Signed TeXpresso macOS app
run-name: Signed TeXpresso macOS (${{ inputs.architecture }})
on:
  workflow_call:
    inputs:
      architecture:
        description: arm64, x86_64, or both
        type: string
        default: arm64
permissions:
  contents: read
concurrency:
  group: texpresso-macos-${{ inputs.architecture }}
  cancel-in-progress: false
jobs:
  macos:
    name: Signed app (${{ matrix.architecture }})
    if: contains(fromJSON('["arm64", "x86_64", "both"]'), inputs.architecture)
    runs-on: ${{ matrix.architecture == 'arm64' && 'macos-15' || 'macos-15-intel' }}
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        architecture: ${{ fromJSON(inputs.architecture == 'both' && '["arm64", "x86_64"]' || format('["{0}"]', inputs.architecture)) }}
    defaults:
      run:
        shell: bash
    env:
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
    steps:
      - name: Check out the live-preview branch
        uses: actions/checkout@v7
        with:
          ref: texpresso
          fetch-depth: 0
          submodules: true
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Read source revisions
        id: source
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          lock = json.load(open('native/dependencies.lock.json'))
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('mupdf=' + lock['mupdf']['revision'] + '\n')
              output.write('zlibng=' + lock['zlibNg']['revision'] + '\n')
              output.write('commit=' + subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip() + '\n')
          PY
      - name: Cache Homebrew downloads
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/Homebrew
          key: signed-app-brew-${{ runner.os }}-${{ matrix.architecture }}-${{ hashFiles('native/*lock.json', 'native/profiles/*', '.github/workflows/texpresso-macos.yml') }}
      - name: Install build dependencies
        run: |
          brew install cmake ninja pkgconf qt qt5compat hunspell \
            freetype jpeg-turbo openjpeg brotli sdl2 harfbuzz graphite2 fontconfig \
            libpng jbig2dec icu4c@78 boost cairo libtiff little-cms2
          echo "$(brew --prefix qt)/bin" >> "$GITHUB_PATH"
      - name: Check tooling contracts
        run: python3 -m unittest discover -s native/tests
      - name: Fetch locked MuPDF sources
        uses: actions/checkout@v7
        with:
          repository: ArtifexSoftware/mupdf
          ref: ${{ steps.source.outputs.mupdf }}
          path: .native-sources/mupdf
          persist-credentials: false
      - name: Initialize only MuPDF's required submodule
        run: git -C .native-sources/mupdf submodule update --init --depth 1 thirdparty/lcms2
      - name: Fetch locked zlib-ng source
        uses: actions/checkout@v7
        with:
          repository: zlib-ng/zlib-ng
          ref: ${{ steps.source.outputs.zlibng }}
          path: .native-sources/zlib-ng
          persist-credentials: false
      - name: Build the shared engine and its complete runtime
        run: |
          python3 native/scripts/build.py --mupdf-source .native-sources/mupdf \
            --icu-prefix "$(brew --prefix icu4c@78)" --zlib-ng-source .native-sources/zlib-ng --jobs 3
          python3 native/scripts/validate_bundle.py "native/.bundles/darwin-$(uname -m)"
      - name: Fetch and build Poppler with Qt preview support
        run: |
          python3 native/scripts/build_poppler.py \
            --cache .native-sources/distribution-sources --work build-poppler-provenance \
            --prefix "$RUNNER_TEMP/poppler" --qt-prefix "$(brew --prefix qt)" --jobs 3 --fetch
          python3 - <<'PY'
          import hashlib, json, pathlib, urllib.request
          lock = json.load(open('native/macos-dependencies.lock.json'))['poppler-data']
          archive = pathlib.Path('.native-sources/poppler-data.tar.gz')
          urllib.request.urlretrieve(lock['url'], archive)
          if hashlib.file_digest(archive.open('rb'), 'sha256').hexdigest() != lock['sha256']:
              raise SystemExit('poppler-data checksum mismatch')
          PY
          mkdir -p .native-sources/poppler-data
          tar -xf .native-sources/poppler-data.tar.gz -C .native-sources/poppler-data --strip-components=1
          make -C .native-sources/poppler-data install prefix="$RUNNER_TEMP/poppler"
      - name: Install the test TeX Live provider
        run: |
          brew install --cask basictex
          # CTAN's redirector may select mirrors at different update levels.
          # Keep self-update and package installation on the same mirror.
          texstudio_texlive_repository=https://mirrors.mit.edu/CTAN/systems/texlive/tlnet
          for attempt in 1 2 3; do
            if sudo /Library/TeX/texbin/tlmgr --repository "$texstudio_texlive_repository" update --self && \
              sudo /Library/TeX/texbin/tlmgr --repository "$texstudio_texlive_repository" install geometry amsmath hyperref xcolor fontspec refcount biblatex biber; then
              break
            fi
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 15
          done
          echo /Library/TeX/texbin >> "$GITHUB_PATH"
      - name: Configure and build TeXstudio with live preview
        run: |
          export PKG_CONFIG_PATH="$RUNNER_TEMP/poppler/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}"
          pkg-config --exists poppler poppler-cpp poppler-qt6
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/poppler;$(brew --prefix qt);$(brew --prefix qt5compat)" \
            -DTEXSTUDIO_ENABLE_TEXPRESSO=ON -DTEXSTUDIO_TEXPRESSO_TESTS=ON
          cmake --build build --parallel 3
      - name: Test live preview and compiler integration
        run: |
          TEXPRESSO_TEST_ENGINE="$PWD/native/.bundles/darwin-$(uname -m)/bin/texpresso" \
            ctest --test-dir build/src/texpresso --output-on-failure
      - name: Deploy Qt, PDF dependencies, and the engine into the app
        run: |
          python3 native/scripts/deploy_macos.py --app build/texstudio.app \
            --output "$RUNNER_TEMP/deploy/texstudio.app" \
            --macdeployqt "$(brew --prefix qt)/bin/macdeployqt" \
            --library-path "$RUNNER_TEMP/poppler/lib" --library-path "$(brew --prefix)/lib" \
            --poppler-data "$RUNNER_TEMP/poppler/share/poppler"
      - name: Prepare project sources and reusable dependency sources
        run: |
          python3 native/scripts/source_release.py \
            --plan .native-sources/source-input-plan \
            --inventory "$RUNNER_TEMP/deploy/texstudio.app/Contents/Resources/licenses/inventory.json"
          python3 native/scripts/source_release.py \
            --prefetch .native-sources/source-input-plan \
            --cache .native-sources/distribution-sources --fetch
          python3 native/scripts/collect_qt_notices.py \
            --inventory "$RUNNER_TEMP/deploy/texstudio.app/Contents/Resources/licenses/inventory.json" \
            --cache .native-sources/distribution-sources --output native/notices/qt
          python3 native/scripts/collect_library_notices.py \
            --inventory "$RUNNER_TEMP/deploy/texstudio.app/Contents/Resources/licenses/inventory.json" \
            --cache .native-sources/distribution-sources --output native/notices/library-sources
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          sys.path.insert(0, 'native/scripts')
          from deploy_macos import collect_license_inventory
          prefix = pathlib.Path(subprocess.check_output(['brew', '--prefix'], text=True).strip())
          qt = pathlib.Path(subprocess.check_output(['brew', '--prefix', 'qt'], text=True).strip())
          runner = pathlib.Path(os.environ['RUNNER_TEMP'])
          collect_license_inventory(runner / 'deploy/texstudio.app', qt / 'bin/macdeployqt',
                                    [runner / 'poppler/lib', prefix / 'lib'], refresh=True)
          PY
          python3 native/scripts/source_release.py \
            --plan .native-sources/source-release-plan \
            --build-dir build \
            --inventory "$RUNNER_TEMP/deploy/texstudio.app/Contents/Resources/licenses/inventory.json"
          python3 native/scripts/source_release.py \
            --assemble .native-sources/source-release-plan \
            --cache .native-sources/distribution-sources --fetch \
            --dependencies dist/dependency-sources \
            --output "dist/texstudio-texpresso-macos-${{ matrix.architecture }}-sources.zip"
      - name: Sign, notarize, staple, and verify the complete app
        timeout-minutes: 45
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          python3 native/scripts/notarize_app.py --app "$RUNNER_TEMP/deploy/texstudio.app" \
            --output "dist/texstudio-texpresso-macos-${{ matrix.architecture }}.zip" \
            --reports notarization --timeout 25m
          TEXPRESSO_TEST_ENGINE="$RUNNER_TEMP/deploy/texstudio.app/Contents/Helpers/texpresso/bin/texpresso" \
            ctest --test-dir build/src/texpresso --output-on-failure
          env QT_QPA_PLATFORM=offscreen "$RUNNER_TEMP/deploy/texstudio.app/Contents/MacOS/texstudio" --version
      - name: Upload the accepted app
        uses: actions/upload-artifact@v7
        with:
          name: texstudio-texpresso-macos-${{ matrix.architecture }}-notarized
          path: dist/*.zip*
          if-no-files-found: error
          retention-days: 14
      - name: Upload reusable dependency sources
        uses: actions/upload-artifact@v7
        with:
          name: texstudio-texpresso-macos-${{ matrix.architecture }}-dependency-sources
          path: dist/dependency-sources/
          if-no-files-found: error
          retention-days: 14
      - name: Build provenance
        if: success()
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: |
          echo "Built texpresso commit: $SOURCE_COMMIT" >> "$GITHUB_STEP_SUMMARY"
          echo "Architecture: ${{ matrix.architecture }}" >> "$GITHUB_STEP_SUMMARY"
          echo 'App signed with Developer ID, accepted by Apple, stapled and Gatekeeper-verified.' >> "$GITHUB_STEP_SUMMARY"
      - name: Remove credentials after failure or cancellation
        if: always()
        run: |
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          for folder in pathlib.Path(os.environ['RUNNER_TEMP']).glob('texpresso-sign-*'):
              subprocess.run(['security', 'delete-keychain', str(folder / 'signing.keychain-db')],
                             stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
              shutil.rmtree(folder)
          PY
      - name: Save build and notarization diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: texstudio-texpresso-macos-${{ matrix.architecture }}-diagnostics
          path: |
            notarization/
            build/CMakeFiles/CMakeConfigureLog.yaml
            build/src/texpresso/Testing/Temporary/
          if-no-files-found: ignore
          retention-days: 14
