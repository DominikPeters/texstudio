name: TeXpresso live preview
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      ui_soak_minutes:
        description: Full-editor soak duration (0 skips the optional Debug build)
        type: choice
        default: '0'
        options: ['0', '1', '10', '30']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'workflow_dispatch' && inputs.ui_soak_minutes != '0' && 90 || 60 }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install Qt, engine build dependencies and TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build build-essential pkg-config patchelf \
            qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-declarative-dev qt6-svg-dev \
            libhunspell-dev libx11-dev libxkbcommon-x11-dev libpoppler-qt6-dev libpoppler-cpp-dev \
            libsdl2-dev libmupdf-dev libmujs-dev libfreetype-dev libgumbo-dev \
            libjbig2dec0-dev libjpeg-dev libopenjp2-7-dev libfontconfig-dev \
            libharfbuzz-dev libgraphite2-dev libicu-dev libpng-dev \
            libleptonica-dev libtesseract-dev texlive-xetex texlive-fonts-recommended texlive-bibtex-extra biber \
            texlive-latex-extra texlive-pictures poppler-utils
      - name: Read locked PNG compressor revision
        id: compressor
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("revision=" + json.load(open("native/dependencies.lock.json"))["zlibNg"]["revision"] + "\n")'
      - name: Fetch locked zlib-ng source
        uses: actions/checkout@v4
        with:
          repository: zlib-ng/zlib-ng
          ref: ${{ steps.compressor.outputs.revision }}
          path: .native-sources/zlib-ng
          persist-credentials: false
      - name: Read locked renderer
        id: renderer
        run: python3 -c 'import json,os; open(os.environ["GITHUB_OUTPUT"], "a").write("revision=" + json.load(open("native/dependencies.lock.json"))["mupdf"]["revision"] + "\n")'
      - uses: actions/checkout@v4
        with:
          repository: ArtifexSoftware/mupdf
          ref: ${{ steps.renderer.outputs.revision }}
          path: .native-sources/mupdf
          persist-credentials: false
      - name: Fetch locked LCMS2 renderer dependency
        run: git -C .native-sources/mupdf submodule update --init --depth 1 thirdparty/lcms2
      - name: Check native tooling and build bundled engine
        id: engine
        run: |
          python3 -m unittest discover -s native/tests
          python3 native/scripts/build_linux.py --mupdf-source .native-sources/mupdf --zlib-ng-source .native-sources/zlib-ng --jobs 2
          python3 native/scripts/validate_bundle.py "native/.bundles/linux-$(uname -m)"
      - name: Read available package providers
        id: providers
        run: python3 -c 'import json,os,platform; caps=json.load(open("native/.bundles/linux-"+platform.machine()+"/build-manifest.json"))["capabilities"]; open(os.environ["GITHUB_OUTPUT"],"a").write("miktex="+str("miktex" in caps.get("packageProviders",[])).lower()+"\n")'
      - name: Build Qt integration clients
        id: qt-build
        run: |
          cmake -S src/texpresso -B build-client -G Ninja
          cmake --build build-client -j2
      - name: Test Qt client against bundled engine
        id: qt-tests
        env:
          TEXPRESSO_TEST_TRACE_PROTOCOL: "1"
          QT_QPA_PLATFORM: offscreen
        run: |
          TEXPRESSO_TEST_ENGINE="$PWD/native/.bundles/linux-$(uname -m)/bin/texpresso" \
            ctest --test-dir build-client --output-on-failure
      - name: Exercise sustained source following on natural 30/100-page documents
        env:
          QT_QPA_PLATFORM: offscreen
          TEXPRESSO_TEST_SUSTAINED: "1"
          TEXPRESSO_SUSTAINED_ARTIFACTS: ${{ github.workspace }}/build-client/sustained-results
        run: |
          TEXPRESSO_TEST_ENGINE="$PWD/native/.bundles/linux-$(uname -m)/bin/texpresso" \
            ctest --test-dir build-client -R '^texpresso-sustained$' --output-on-failure
      - name: Build and install application with engine runtime
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build -j2
          DESTDIR="$PWD/build/package" cmake --install build
          test -x build/package/usr/libexec/texstudio/texpresso/bin/texpresso
          test -x build/package/usr/libexec/texstudio/texpresso/bin/texpresso-xetex
          build/package/usr/libexec/texstudio/texpresso/bin/texpresso -capabilities
      - name: Build Debug app and run the optional full-editor soak
        if: github.event_name == 'workflow_dispatch' && inputs.ui_soak_minutes != '0'
        env:
          SOAK_MINUTES: ${{ inputs.ui_soak_minutes }}
        run: |
          cmake -S . -B build-soak -G Ninja -DCMAKE_BUILD_TYPE=Debug -DTEXSTUDIO_ENABLE_TESTS=ON
          cmake --build build-soak -j2
          python3 native/scripts/ui_soak.py --app build-soak/texstudio \
            --output build-soak/ui-soak --seconds "$((SOAK_MINUTES * 60))" --platform offscreen
      - name: Install MiKTeX for provider integration tests
        id: miktex-setup
        if: ${{ !cancelled() && steps.qt-build.conclusion == 'success' && steps.providers.outputs.miktex == 'true' }}
        timeout-minutes: 10
        run: |
          curl -fsSL https://miktex.org/download/key | sudo gpg --dearmor -o /usr/share/keyrings/miktex.gpg
          echo "deb [signed-by=/usr/share/keyrings/miktex.gpg] https://miktex.org/download/ubuntu noble universe" | sudo tee /etc/apt/sources.list.d/miktex.list
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends miktex
          miktexsetup finish
      - name: Test Qt editing and bibliography with actual MiKTeX
        if: ${{ !cancelled() && steps.miktex-setup.conclusion == 'success' }}
        timeout-minutes: 20
        env:
          QT_QPA_PLATFORM: offscreen
          TEXPRESSO_PACKAGE_PROVIDER: miktex
          TEXPRESSO_TEST_MIKTEX_AUTO_INSTALL: "1"
          TEXPRESSO_TEST_TRACE_PROTOCOL: "1"
          TEXPRESSO_TEST_ARTIFACTS: ${{ github.workspace }}/build-client/miktex-results
        run: |
          export PATH="$HOME/bin:$HOME/.miktex/texmfs/install/miktex/bin:$PATH"
          mkdir -p build-client/miktex-results
          mpm --update-db
          # Exercise the shared provider's explicit download opt-in, fonts and
          # private format cache before testing the client's no-install policy.
          python3 native/texpresso/test/test-miktex-real.py "$PWD/native/.bundles/linux-$(uname -m)/bin/texpresso"
          miktex packages install hyperref biblatex biber-linux-x86_64
          miktex links install
          findtexmf --must-exist pzdr.tfm
          miktex --disable-installer fontmaps configure
          TEXPRESSO_TEST_ENGINE="$PWD/native/.bundles/linux-$(uname -m)/bin/texpresso" \
            build-client/texpresso-wsl-tests realEngine bibliographyBuild \
            -o build-client/miktex-results/qt.txt,txt -o build-client/miktex-results/qt.xml,junitxml
          # Repeat after installation to establish that an offline-policy launch
          # can edit, navigate and restart with the populated package set.
          TEXPRESSO_TEST_MIKTEX_AUTO_INSTALL=0 \
          TEXPRESSO_TEST_ENGINE="$PWD/native/.bundles/linux-$(uname -m)/bin/texpresso" \
            build-client/texpresso-wsl-tests realEngine \
            -o build-client/miktex-results/qt-offline.txt,txt -o build-client/miktex-results/qt-offline.xml,junitxml
      - name: Save MiKTeX provider evidence
        if: always() && steps.miktex-setup.conclusion == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: qt-miktex-provider-results
          path: build-client/miktex-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Save full-editor soak evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.ui_soak_minutes != '0'
        uses: actions/upload-artifact@v4
        with:
          name: linux-full-editor-soak
          path: build-soak/ui-soak/
          if-no-files-found: ignore
      - name: Save build diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: linux-live-preview-diagnostics
          path: |
            build-client/Testing/Temporary/
            build-client/miktex-results/
            build-client/sustained-results/
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
